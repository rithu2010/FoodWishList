<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Order Wishlist Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container">
    <header>
        <h1>Food Order Wishlist Manager</h1>
        <p>Track your must-try dishes and favorite restaurants.</p>
    </header>

    <main>
        <section class="card form-card">
            <h2>Add / Edit Food Item</h2>
            <form id="food-form">
                <input type="hidden" id="food-id">

                <div class="form-group">
                    <label for="food-name">Food Name<span class="required">*</span></label>
                    <input type="text" id="food-name" placeholder="Ex: Margherita Pizza" required>
                </div>

                <div class="form-group">
                    <label for="restaurant-name">Restaurant Name</label>
                    <input type="text" id="restaurant-name" placeholder="Ex: Bella Italia">
                </div>

                <div class="form-group">
                    <label for="rating">Rating (1–5)</label>
                    <input type="number" id="rating" min="1" max="5" placeholder="5">
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-btn">Add to Wishlist</button>
                    <button type="button" id="cancel-edit-btn" class="secondary hidden">Cancel Edit</button>
                </div>
            </form>
        </section>

        <section class="card list-card">
            <div class="list-header">
                <h2>Wishlist Items</h2>
                <button id="refresh-btn" class="secondary small">Refresh</button>
            </div>
            <div id="alerts"></div>
            <div id="empty-state" class="empty-state hidden">
                No items yet. Add your first wishlist food above!
            </div>
            <div id="food-list" class="food-list"></div>
        </section>
    </main>

    <footer>
        <small>Backend API URL: <span id="api-url-display"></span></small>
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
